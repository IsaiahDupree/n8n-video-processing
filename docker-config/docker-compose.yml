version: '3.8'

services:
  n8n:
    build:
      context: .
      dockerfile: n8n.Dockerfile
    # image: n8nio/n8n:latest  # Commented out - using custom build with FFmpeg
    container_name: docker-config-n8n-1
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,os,child_process,util,crypto,stream,buffer,events,url,querystring,string_decoder,punycode,http,https,net,dgram,dns,tls,zlib,readline,assert,constants,timers,tty,domain,process
      - NODE_OPTIONS=--max-old-space-size=8192
      - EXECUTIONS_TIMEOUT=3600000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - N8N_LOG_LEVEL=debug
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_OAUTH2_CALLBACK_URL=http://localhost:5678/rest/oauth2-credential/callback
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_STORAGE_PATH=/home/node/.n8n/binaryData
      - N8N_PAYLOAD_SIZE_MAX=1024
    volumes:
      - ./data:/home/node/.n8n
      - "//c/Users/Isaia/Documents/Coding/N8N/shared/videos:/home/node/shared/videos:rw"
      - ./custom-nodes:/home/node/custom-nodes
      - ./workflows:/home/node/workflows
    user: "1000:1000"
    depends_on:
      - postgres
    networks:
      - n8n-network

  postgres:
    image: postgres:14
    container_name: docker-config-postgres-1
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n-network

  flaskdrive:
    image: n8n-flaskdrive
    container_name: flaskdrive
    restart: unless-stopped
    ports:
      - "5002:5000"
    volumes:
      - "//c/Users/Isaia/Documents/Coding/N8N/shared/videos:/srv/shared/videos"
      - "//c/Users/Isaia/Documents/Coding/N8N/flaskdrive/data:/srv/data:rw"
      - "//c/Users/Isaia/Documents/Coding/N8N/flaskdrive/client_secret.json:/srv/client_secret.json:ro"
    networks:
      - n8n-network
    environment:
      - FLASK_ENV=production
      - DISABLE_AUTH=true
      - ALLOW_INTERNAL_ACCESS=true
      - INTERNAL_NETWORK=n8n-network

volumes:
  postgres_data:

networks:
  n8n-network:
    driver: bridge
